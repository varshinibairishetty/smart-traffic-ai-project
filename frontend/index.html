<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Traffic Management and Accident Risk Prediction System — Operator Dashboard" />

    <title>Smart Traffic AI — Dashboard</title>

    <!--
      Google Fonts loaded here so every component can use them via CSS.
      Inter       — main UI font (clean, readable numbers and labels)
      JetBrains Mono — monospace font for IDs, timestamps, and code values
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      React mounts the entire app into this <div>.
      src/main.jsx does the mounting — you don't need to touch this file often.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
