# docker-compose.yml
# Multi-container orchestration for Smart Traffic Management & Accident Risk Prediction System
#
# Services:
#   1. backend:    Node.js Express + Socket.io (Port 5000) serving REST APIs, WebSockets,
#                  persistent incident storage, and static built React frontend.
#   2. ai-service: Python FastAPI (Port 8000) running YOLOv8 computer vision detection,
#                  vehicle counting, and deterministic risk score evaluation.
#
# Quickstart:
#   docker-compose up --build

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smart-traffic-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - BROADCAST_INTERVAL_MS=5000
      - DETECTION_OUTPUT_PATH=../ai-service/detection_output.json
    volumes:
      # Persistent storage volume for incidents.json across container restarts
      - traffic_incidents_data:/app/backend/data
      # Shared detection output directory
      - shared_detection_data:/app/ai-service
    depends_on:
      - ai-service
    restart: unless-stopped
    networks:
      - traffic-network

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: smart-traffic-ai-service
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - SOCKET_SERVER_URL=http://backend:5000
    volumes:
      # Share detection output file with backend service
      - shared_detection_data:/app
    restart: unless-stopped
    networks:
      - traffic-network

volumes:
  traffic_incidents_data:
    driver: local
  shared_detection_data:
    driver: local

networks:
  traffic-network:
    driver: bridge
