# .github/workflows/ci.yml
# Automated Continuous Integration (CI) pipeline for Smart Traffic Management system.
# Runs on push and pull requests to verify:
#   1. Backend Node.js tests (Jest + Supertest)
#   2. AI Service Python tests (PyTest)
#   3. Frontend Vite production build verification

name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── 1. Backend Testing ─────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm install

      - name: Syntax verification
        run: |
          node --check backend/server.js
          node --check backend/utils/logger.js
          node --check backend/utils/riskCalculator.js
          node --check backend/utils/incidentStore.js
          node --check backend/utils/analyticsAggregator.js

      - name: Run Jest unit & integration tests
        run: |
          cd backend
          npm test

  # ─── 2. Python AI Service Testing ──────────────────────────────────────────
  ai-service-tests:
    name: Computer Vision & Risk Model Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          pip install pytest httpx

      - name: Run PyTest suite (Risk Heuristic & API Endpoints)
        run: |
          pytest ai-service/tests

  # ─── 3. Frontend Production Build ──────────────────────────────────────────
  frontend-build:
    name: Frontend Compilation & Bundling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Verify Vite production compilation
        run: |
          cd frontend
          npm run build
